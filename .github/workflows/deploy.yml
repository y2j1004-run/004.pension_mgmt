name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # weekdays after the Korean market closes: refresh ETF prices, news and the briefing.
  # GitHub runs schedules on a best-effort basis and sometimes skips one, so try three times
  # (16:47, 18:17, 21:17 KST); a later run just refreshes the same day's data.
  schedule:
    - cron: '47 7 * * 1-5'
    - cron: '17 9 * * 1-5'
    - cron: '17 12 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # daily closes of every listed ETF; if it fails the app is still deployed (with the prices it can recover)
      - run: node scripts/fetch_prices.mjs dist/prices
        continue-on-error: true
        env:
          LIVE_URL: https://y2j1004-run.github.io/004.pension_mgmt/prices
      # headlines for a fixed list of market themes (not anyone's funds), for the closing briefing
      - run: node scripts/fetch_news.mjs dist/prices
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
